[project]
name = "lemastra-api"
version = "0.1.0"
description = "LemAstra local calculation service — FastAPI wrapper around the vendored astrology-skill calculator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Domain-critical: exact pins — any change alters calculated output and
    # must go through the golden-fixture regeneration gate (STACK.md).
    "pyswisseph==2.10.3.2",
    "tzdata==2026.3",
    # Current stable, locked via uv.lock (exact resolution committed).
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "jsonschema>=4.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
# Application (not a library): never build/install lemastra_api as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
